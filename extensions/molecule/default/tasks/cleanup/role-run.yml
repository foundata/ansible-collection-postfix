# Execute the collection role "run" against all driver-created instances (cleanup / absent)

- name: "Molecule | Cleanup | Include the foundata.postfix.run role"
  ansible.builtin.include_role:
    name: "foundata.postfix.run"
  vars:
    run_postfix_state: "absent"


# "absent" has to take the lookup table files this role created (and any compiled
# database built from them) off the host again; the SMTP SASL password file
# additionally holds relay credentials.
- name: "Molecule | Cleanup | Initialize the foundata.postfix.run role (without running it; expose internal variables)"
  ansible.builtin.include_role:
    name: "foundata.postfix.run"
    tasks_from: "init"
    public: true


- name: "Molecule | Cleanup | Stat the lookup table files the role created"
  ansible.builtin.stat:
    path: "{{ item[0] }}{{ item[1] }}"
    get_attributes: false
    get_checksum: false
  register: __testing_uninstall_leftovers
  loop: >-
    {{
      __run_postfix_uninstall_file_paths
      | ansible.builtin.product(__run_postfix_uninstall_file_suffixes)
      | ansible.builtin.list
    }}
  loop_control:
    label: "{{ item[0] }}{{ item[1] }}"


- name: "Molecule | Cleanup | Check no role-created lookup table files are left behind"
  ansible.builtin.assert:
    that:
      - (__testing_uninstall_leftovers['results']
         | ansible.builtin.selectattr('stat.exists')
         | ansible.builtin.list | ansible.builtin.length) == 0
    fail_msg: >-
      run_postfix_state=absent left role-created file(s) on the host:
      {{ __testing_uninstall_leftovers['results']
         | ansible.builtin.selectattr('stat.exists')
         | ansible.builtin.map(attribute='invocation.module_args.path')
         | ansible.builtin.join(', ') }}
    success_msg: "No role-created lookup table files remain after run_postfix_state=absent"


- name: "Molecule | Cleanup | Read the aliases file after the uninstall"
  ansible.builtin.slurp:
    src: "/etc/aliases"
  register: __testing_aliases_after_uninstall


- name: "Molecule | Cleanup | Check the aliases file was reverted without touching foreign entries"
  ansible.builtin.assert:
    that:
      # the entry the role disabled is active again, marker gone
      - "'molecule_preexisting: root' in __testing_aliases_decoded"
      - "__run_postfix_table_aliases_disabled_marker not in __testing_aliases_decoded"
      # the entry the administrator disabled is still disabled, untouched
      - "'#molecule_predisabled: root' in __testing_aliases_decoded"
      # the managed block is gone
      - "'ANSIBLE MANAGED BLOCK' not in __testing_aliases_decoded"
    fail_msg: >-
      The aliases file was not reverted correctly after run_postfix_state=absent:
      {{ __testing_aliases_decoded }}
    success_msg: "Aliases file reverted: role-disabled entry restored, administrator-disabled entry untouched, managed block removed"
  vars:
    __testing_aliases_decoded: "{{ __testing_aliases_after_uninstall['content'] | ansible.builtin.b64decode }}"
