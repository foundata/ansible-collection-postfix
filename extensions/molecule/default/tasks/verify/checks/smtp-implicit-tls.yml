# Include where useful: SMTP dialog (implicit TLS / wrapper mode, e.g. smtps 465)

- name: "Molecule | Verify | SMTP (implicit TLS, OpenSSL) {{ __testing_hostdata['host'] ~ ':' ~ __testing_hostdata['port'] }}"
  ansible.builtin.expect:
    # No -starttls: the connection must be TLS from the first byte (wrapper
    # mode). A plaintext smtpd on this port would fail the handshake.
    command: >
        {{ __testing_openssl_executable }}
          s_client -crlf -quiet
          -connect {{ __testing_hostdata['host'] ~ ':' ~ __testing_hostdata['port'] | ansible.builtin.quote }}
    responses:
      '(?i)220 .*\r?\n': "EHLO {{ __testing_hostdata['smtp_hostname'] }}"
      '(?i)250 .*\r?\n': "QUIT"
      '(?i)221.*\r?\n': ""
    timeout: 5
  changed_when:
    - false
  register: __testing_run_postfix_smtp_implicittls_result


- name: "Molecule | Verify | Assert correct answers: SMTP (implicit TLS, OpenSSL) {{ __testing_hostdata['host'] ~ ':' ~ __testing_hostdata['port'] }}"
  ansible.builtin.assert:
    that:
      - __testing_run_postfix_smtp_implicittls_result is succeeded
      - ('verify return:') in __testing_run_postfix_smtp_implicittls_result['stdout']
      - ('220 ') in __testing_run_postfix_smtp_implicittls_result['stdout']
      - ('250 ') in __testing_run_postfix_smtp_implicittls_result['stdout']
      - ('221 2.0.0 Bye') in __testing_run_postfix_smtp_implicittls_result['stdout']
    fail_msg: "SMTP implicit-TLS check failed: Expected proper responses to SMTP commands over a TLS-from-the-first-byte connection"
    success_msg: "SMTP dialog over implicit TLS (wrapper mode) works as expected"
