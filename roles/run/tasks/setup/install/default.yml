# Install: Manage basic resource setup, such as packages or service users.

---

- name: "Setup | Install | Default | Remove unwanted packages (e.g., to prevent conflicts or resolve incompatibilities)"
  ansible.builtin.package:
    name: "{{ __run_postfix_packages_removal }}"
    state: "absent"
  when:
    - __run_postfix_packages_removal is ansible.builtin.defined
    - (__run_postfix_packages_removal | ansible.builtin.length) > 0


- name: "Setup | Install | Default | Install or upgrade packages"
  ansible.builtin.package:
    name: "{{ __run_postfix_packages_install }}"
    state: "{{ 'latest' if (run_postfix_autoupgrade | ansible.builtin.bool) else 'present' }}"
  when:
    - __run_postfix_packages_install is ansible.builtin.defined
    - (__run_postfix_packages_install | ansible.builtin.length) > 0
  register: __run_postfix_package_install_result # to decide if a handler flush (config/default.yml) is necessary
  notify:
    # new or upgraded binaries only take effect with a full restart (a restart
    # of a stopped service is a start, so this is also safe on fresh installs)
    - "run_postfix: restart postfix.service"


- name: "Setup | Install | Default | Print additional map backends (extracted from main.cf and default settings)"
  ansible.builtin.debug:
    msg: "{{ lookup('ansible.builtin.template', 'helper_list_map_backends.j2') }}"
    verbosity: 4


- name: "Setup | Install | Default | Install or upgrade additional packages for used map backends"
  ansible.builtin.package:
    name: "{{ __run_postfix_packages_install_map_backends[__run_postfix_map_backend_item] }}"
    state: "{{ 'latest' if (run_postfix_autoupgrade | ansible.builtin.bool) else 'present' }}"
  loop: "{{ lookup('ansible.builtin.template', 'helper_list_map_backends.j2') }}"
  loop_control:
    loop_var: "__run_postfix_map_backend_item"
  when:
    - __run_postfix_packages_install_map_backends[__run_postfix_map_backend_item] | ansible.builtin.length > 0
  register: __run_postfix_package_install_map_backends_result # to decide if a handler flush (config/default.yml) is necessary


- name: "Setup | Install | Default | Remove unwanted files and directories (e.g., to prevent conflicts or resolve incompatibilities)"
  ansible.builtin.file:
    path: "{{ __run_postfix_removal_path_item }}"
    state: "absent"
  when:
    - __run_postfix_paths_removal is ansible.builtin.defined
    - (__run_postfix_paths_removal | ansible.builtin.length) > 0
  loop: "{{ __run_postfix_paths_removal }}"
  loop_control:
    loop_var: "__run_postfix_removal_path_item"


- name: "Setup | Install | Default | Neutralize distribution config files (overwrite to survive package updates)"
  ansible.builtin.copy:
    dest: "{{ __run_postfix_neutralize_item['key'] }}"
    content: |
      {{ __run_postfix_neutralize_item['value'] }} Managed by Ansible (foundata.postfix.run)
      {{ __run_postfix_neutralize_item['value'] }}
      {{ __run_postfix_neutralize_item['value'] }} Content intentionally cleared. The original distribution file conflicted
      {{ __run_postfix_neutralize_item['value'] }} with configuration managed by the foundata.postfix.run role.
      {{ __run_postfix_neutralize_item['value'] }}
      {{ __run_postfix_neutralize_item['value'] }} To restore the original file content, reinstall the owning package:
      {% if (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian' %}
      {{ __run_postfix_neutralize_item['value'] }}   dpkg -S '{{ __run_postfix_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_postfix_neutralize_item['value'] }}   apt-get install --reinstall <package>  # reinstall it to restore the original
      {% elif (ansible_facts['os_family'] | ansible.builtin.lower) == 'suse' %}
      {{ __run_postfix_neutralize_item['value'] }}   rpm -qf '{{ __run_postfix_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_postfix_neutralize_item['value'] }}   zypper install --force <package>  # reinstall it to restore the original
      {% elif (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat' %}
      {{ __run_postfix_neutralize_item['value'] }}   rpm -qf '{{ __run_postfix_neutralize_item['key'] }}'  # find the package that owns this file
      {{ __run_postfix_neutralize_item['value'] }}   dnf reinstall <package>  # reinstall it to restore the original
      {% else %}
      {{ __run_postfix_neutralize_item['value'] }}   Use your package manager to find the owning package and reinstall it.
      {% endif %}
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644
  when:
    - __run_postfix_paths_neutralize is ansible.builtin.defined
    - (__run_postfix_paths_neutralize | ansible.builtin.length) > 0
  loop: "{{ __run_postfix_paths_neutralize | ansible.builtin.dict2items }}"
  loop_control:
    loop_var: "__run_postfix_neutralize_item"
    label: "{{ __run_postfix_neutralize_item['key'] }}"
