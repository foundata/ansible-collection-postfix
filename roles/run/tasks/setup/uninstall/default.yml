# Uninstall: Manage basic resource removal, such as packages or service users.

---

# Done before the packages are removed so the paths are still the ones this role
# managed. Leaving these behind would contradict "revert as much as possible",
# and the SMTP SASL password file additionally holds relay credentials in clear
# text. See __run_postfix_uninstall_file_paths in vars/main.yml for what is
# covered and which files are deliberately left alone.
- name: "Setup | Uninstall | Remove the lookup table files created by this role and their compiled databases"
  ansible.builtin.file:
    path: "{{ __run_postfix_uninstall_path_item[0] }}{{ __run_postfix_uninstall_path_item[1] }}"
    state: "absent"
  loop: >-
    {{
      __run_postfix_uninstall_file_paths
      | ansible.builtin.product(__run_postfix_uninstall_file_suffixes)
      | ansible.builtin.list
    }}
  loop_control:
    loop_var: "__run_postfix_uninstall_path_item"
    label: "{{ __run_postfix_uninstall_path_item[0] }}{{ __run_postfix_uninstall_path_item[1] }}"


# /etc/aliases itself is a system file shared with any other local MTA, so it is
# not removed. Only what this role added to it is reverted: first the entries it
# disabled (identified by the marker, never a "#" the administrator put there),
# then its managed block. Restoring before removing the block keeps the file
# usable at every point in between.
- name: "Setup | Uninstall | Restore the aliases entries this role disabled"
  ansible.builtin.replace:
    path: "{{ __run_postfix_table_aliases_file_path }}"
    regexp: '^{{ __run_postfix_table_aliases_disabled_marker | ansible.builtin.regex_escape }}(.*)$'
    replace: '\1'


- name: "Setup | Uninstall | Remove the managed block from the aliases file"
  ansible.builtin.blockinfile:
    path: "{{ __run_postfix_table_aliases_file_path }}"
    marker: "### {mark} ANSIBLE MANAGED BLOCK ###"
    state: "absent"


- name: "Setup | Uninstall | Remove packages"
  ansible.builtin.package:
    name: "{{ __run_postfix_packages_uninstall }}"
    state: "absent"
  when:
    - __run_postfix_packages_uninstall is ansible.builtin.defined
    - (__run_postfix_packages_uninstall | ansible.builtin.length) > 0
