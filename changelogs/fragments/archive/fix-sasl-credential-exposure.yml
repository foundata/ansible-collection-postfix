---

security_fixes:
  - >
    ``run`` role - The task writing ``/etc/postfix/smtp_sasl_password`` had no
    ``no_log``, so a ``--diff`` run printed the relay credentials to the Ansible
    output and any log capturing it. An ``-vvv`` run additionally printed the
    merged credential map from ``tasks/init.yml``. The template task is now
    ``no_log``, ``run_postfix_smtp_sasl_password_map`` is marked ``no_log`` in the
    argument specification, and the debug output shows only the lookup keys (the
    relay hosts) instead of the credentials.
  - >
    ``run`` role - ``run_postfix_state: absent`` removed the packages but left
    ``/etc/postfix/smtp_sasl_password`` and its compiled database on disk,
    keeping relay credentials in clear text on a host the role was told to
    revert. The uninstall now removes the file and every compiled database
    variant of it.
